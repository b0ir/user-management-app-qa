name: PR Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label-and-assign:
    name: Label & Assign
    runs-on: ubuntu-latest
    steps:
      - name: Apply label and assign
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const pr     = context.payload.pull_request.number;
            const owner  = context.repo.owner;
            const repo   = context.repo.repo;
            const author = context.payload.pull_request.user.login;

            const labelDefs = [
              { pattern: /^(fix|bugfix|hotfix)\//, name: 'bug',           color: 'd73a4a' },
              { pattern: /^(feat|feature)\//,       name: 'enhancement',  color: '0075ca' },
              { pattern: /^docs?\//,                name: 'documentation', color: '0075ca' },
              { pattern: /^(chore|ci|build)\//,     name: 'chore',        color: 'e4e669' },
              { pattern: /^refactor\//,             name: 'refactor',     color: 'd4c5f9' },
              { pattern: /^(deps?|dependabot)\//,   name: 'dependencies', color: '0366d6' },
            ];

            const existingLabels = await github.rest.issues.listLabelsForRepo({ owner, repo, per_page: 100 });
            const existingNames  = existingLabels.data.map(l => l.name);

            for (const def of labelDefs) {
              if (!existingNames.includes(def.name)) {
                await github.rest.issues.createLabel({ owner, repo, name: def.name, color: def.color }).catch(() => {});
              }
            }
            if (!existingNames.includes('needs-triage')) {
              await github.rest.issues.createLabel({ owner, repo, name: 'needs-triage', color: 'ededed' }).catch(() => {});
            }

            const matched = labelDefs.find(d => d.pattern.test(branch));
            const labelToApply = matched ? matched.name : 'needs-triage';
            await github.rest.issues.addLabels({ owner, repo, issue_number: pr, labels: [labelToApply] });

            await github.rest.issues.addAssignees({ owner, repo, issue_number: pr, assignees: ['b0ir'] });

            if (author !== 'b0ir') {
              await github.rest.pulls.requestReviewers({ owner, repo, pull_number: pr, reviewers: ['b0ir'] }).catch(() => {});
            }

  quick-checks:
    name: Quick Checks
    runs-on: ubuntu-latest
    outputs:
      lint_result:       ${{ steps.lint.outcome }}
      typecheck_result:  ${{ steps.typecheck.outcome }}
      build_result:      ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        run: npm run lint
        continue-on-error: true

      - name: Type check
        id: typecheck
        run: npm run type-check
        continue-on-error: true

      - name: Build
        id: build
        run: npm run build
        continue-on-error: true

      - name: Post checks summary
        uses: actions/github-script@v7
        with:
          script: |
            const icon = (r) => r === 'success' ? '✅' : '❌';
            const body = [
              '## PR Quick Checks',
              '',
              '| Check | Result |',
              '|---|---|',
              `| Lint | ${icon('${{ steps.lint.outcome }}')} \`${{ steps.lint.outcome }}\` |`,
              `| Type check | ${icon('${{ steps.typecheck.outcome }}')} \`${{ steps.typecheck.outcome }}\` |`,
              `| Build | ${icon('${{ steps.build.outcome }}')} \`${{ steps.build.outcome }}\` |`,
              '',
              `> Run on commit \`${{ github.event.pull_request.head.sha }}\``,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Review with Qwen and post comment
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          GH_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER:          ${{ github.event.pull_request.number }}
          PR_TITLE:           ${{ github.event.pull_request.title }}
          PR_BODY:            ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, subprocess, sys

          api_key  = os.environ.get("NVIDIA_NIM_API_KEY", "")
          pr_num   = os.environ["PR_NUMBER"]
          pr_title = os.environ.get("PR_TITLE", "")
          pr_body  = os.environ.get("PR_BODY", "") or ""

          if not api_key:
              print("NVIDIA_NIM_API_KEY not set -- skipping AI review")
              sys.exit(0)

          diff_raw = subprocess.run(
              ["gh", "pr", "diff", pr_num],
              capture_output=True, text=True
          ).stdout
          diff = diff_raw[:12000]
          if not diff.strip():
              print("Empty diff -- skipping AI review")
              sys.exit(0)

          prompt = (
              "You are a senior software engineer reviewing a pull request.\n"
              "Analyze the diff and provide a concise review covering:\n"
              "1. **Summary** - what the PR does\n"
              "2. **Bugs / logic errors** - anything that looks broken\n"
              "3. **Security concerns** - if any\n"
              "4. **Code quality** - notable issues only, skip style nits\n"
              "5. **Verdict** - one of: Looks good | Minor issues | Needs work\n\n"
              "Be specific and actionable. Format in Markdown.\n\n"
              f"**PR Title:** {pr_title}\n"
              f"**PR Description:** {pr_body}\n\n"
              f"**Diff** (may be truncated):\n```diff\n{diff}\n```"
          )

          payload = {
              "model": "qwen/qwen3-coder-480b-a35b-instruct",
              "messages": [{"role": "user", "content": prompt}],
              "temperature": 0.2,
              "max_tokens": 1024,
          }

          req = urllib.request.Request(
              "https://integrate.api.nvidia.com/v1/chat/completions",
              data=json.dumps(payload).encode(),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {api_key}",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  data = json.loads(resp.read())
              review = data["choices"][0]["message"]["content"]
          except Exception as e:
              print(f"NIM API error: {e}")
              sys.exit(0)

          comment = "## AI Code Review\n\n" + review + "\n\n---\n*Powered by Qwen3-Coder 480B via NVIDIA NIM*"

          subprocess.run(
              ["gh", "pr", "comment", pr_num, "--body", comment],
              check=True
          )
          print("Review comment posted.")
          PYEOF
